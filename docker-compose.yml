services:
  app:   # API + web UI on one port
    build: { context: ., dockerfile: Dockerfile.api }
    env_file: [{ path: .env, required: false }]   # GEMINI_API_KEY optional: no key = mock mode
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health')"]
      interval: 10s
      retries: 5
